// JTermOS genimage 配置
image boot.vfat {
    vfat {
    files = {
        "boot/Image.gz",
        "boot/__BOARD_DTB__",
        "boot/grub.cfg",
        "boot/EFI/BOOT/grubaa64.efi",
        "boot/boot.scr"
    }
    }
    size = 128M
}

image jtermos.sdcard.img {
    hdimage {
        partition-table-type = mbr
    }
    partition boot {
        image = "boot.vfat"
        offset = 2048
        size = 128M
        bootable = true
    }
    partition rootfs {
        image = "jtermos-rootfs.squashfs"
        offset = 262144
        size = 128M
    }
    partition data {
        partition-type = 0x83
        offset = 524288
        size = 3500M
    }
}