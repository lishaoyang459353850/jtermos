# GRUB 配置
set default=0
set timeout=5
set timeout_style=menu

insmod all_video
insmod gfxterm
insmod serial

serial
terminal_input serial console
terminal_output serial console

# 用文件名可靠定位 root（CD 引导时避免设备号错乱）
search --no-floppy --set=root --file /boot/bzImage

menuentry "JTermOS 1.0 (Linux)" {
    linux /boot/bzImage console=ttyS0,115200 console=tty0 quiet loglevel=3 rdinit=/sbin/init
    initrd /boot/initramfs.cpio.gz
    boot
}

menuentry "JTermOS 1.0 (rescue shell)" {
    linux /boot/bzImage console=ttyS0,115200 console=tty0 loglevel=7 rdinit=/bin/sh
    initrd /boot/initramfs.cpio.gz
    boot
}